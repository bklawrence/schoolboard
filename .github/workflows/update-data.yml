name: Update and publish SchoolBoard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "schoolboard-pages"
  cancel-in-progress: false

jobs:
  update-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check selenium pypdf pymupdf

      - name: Build current data
        run: python build_data.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- schoolboard-data.json; then
            echo "No data changes."
          else
            cp schoolboard-data.json "$RUNNER_TEMP/schoolboard-data.json"

            git fetch origin main
            git reset --hard origin/main

            cp "$RUNNER_TEMP/schoolboard-data.json" schoolboard-data.json

            if git diff --quiet -- schoolboard-data.json; then
              echo "Latest main already contains the generated data."
            else
              git config user.name "schoolboard-bot"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add schoolboard-data.json
              git commit -m "Update SchoolBoard data"
              git push origin HEAD:main
            fi
          fi

      - name: Verify Home Screen assets
        run: |
          echo "Repository root contents:"
          find . -maxdepth 1 -type f -printf '%f\n' | sort

          missing=0
          for f in index.html schoolboard-data.json manifest.webmanifest apple-touch-icon.png; do
            if [ ! -f "$f" ]; then
              echo "::error::Required site asset is missing from repository root: $f"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more required Home Screen files are missing."
            exit 1
          fi

      - name: Prepare public site
        run: |
          rm -rf site
          mkdir -p site

          cp index.html schoolboard-data.json site/
          cp manifest.webmanifest apple-touch-icon.png site/

          for f in favicon.png favicon.svg apple-touch-icon-*.png; do
            if [ -f "$f" ]; then
              cp "$f" site/
            fi
          done

          echo "Files that will be published to GitHub Pages:"
          find site -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update-and-upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            count="$(
              gh api \
                "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'
            )"

            if [ "$count" -gt 0 ]; then
              echo "github-pages artifact is visible to the Actions API."
              exit 0
            fi

            echo "github-pages artifact not visible yet (attempt $attempt/8)."
            sleep 5
          done

          echo "::error::github-pages artifact was uploaded but did not become visible to the Actions API."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
