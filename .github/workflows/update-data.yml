name: Update SchoolBoard data

on:
  workflow_dispatch:
  schedule:
    # Every four hours, offset from the top of the hour to reduce queue delays.
    - cron: "17 */4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current data
        run: python build_data.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- schoolboard-data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "schoolboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schoolboard-data.json
          git commit -m "Update SchoolBoard data"
          git push
