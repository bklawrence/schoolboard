name: Update and publish SchoolBoard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "schoolboard-data.json"
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "schoolboard-pages"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check selenium pypdf pymupdf

      - name: Build current data
        run: python build_data.py

      - name: Check whether this run is still current
        id: freshness
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "This run is still based on the current main branch."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main advanced while this build was running."
            echo "Skipping data push and Pages deployment; the newer run will publish instead."
          fi

      - name: Commit changed data
        if: steps.freshness.outputs.current == 'true'
        run: |
          if git diff --quiet -- schoolboard-data.json; then
            echo "No data changes."
          else
            git config user.name "schoolboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schoolboard-data.json
            git commit -m "Update SchoolBoard data"
            git push
          fi

      - name: Prepare public site
        if: steps.freshness.outputs.current == 'true'
        run: |
          mkdir -p site
          cp index.html schoolboard-data.json site/

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.current == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.freshness.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
