name: Update and publish SchoolBoard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "schoolboard-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check selenium pypdf

      - name: Build current data
        run: python build_data.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- schoolboard-data.json; then
            echo "No data changes."
          else
            git config user.name "schoolboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schoolboard-data.json
            git commit -m "Update SchoolBoard data"
            git push
          fi

      - name: Prepare public site
        run: |
          mkdir -p site
          cp index.html schoolboard-data.json site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
